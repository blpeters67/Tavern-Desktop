<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Tavern</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><img class="logo" src="../../assets/icon.png" alt=""><p class="eyebrow">TAVERN DESKTOP</p>
<h1 id="title">A seat at your table.</h1><p id="description">Your stories, your people, your Tavern.</p>
<form id="connect-form"><label for="address">Tavern address</label><input id="address" type="url" placeholder="https://tavern.benjis.site/" required spellcheck="false" autocomplete="url"><button id="connect" type="submit">Open Tavern</button></form>
<button id="retry" class="secondary" hidden>Try Again</button><p id="error" role="alert"></p><p class="foot">Your desktop app connects to your existing Tavern server.</p>
</main><script src="local.js"></script></body></html>
